version: "3.9"

services:
  mysql:
    image: mysql:9
    container_name: cardivore_db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: cardivore_ai
      MYSQL_USER: cardivore
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cardivore_net

volumes:
  db_data:
    name: cardivore_db_data

networks:
  cardivore_net:
    driver: bridge

